[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"agent-contracts",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openreview-py>=2.6,<3",
    "pypdf>=5.0,<7",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
agent-contracts = { path = "../../packages/agent-contracts", editable = true }
