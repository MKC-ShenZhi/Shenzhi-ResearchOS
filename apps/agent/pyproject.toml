[project]
name = "shenzhi-agent"
version = "0.1.0"
description = "ShenZhi Agent Platform service"
requires-python = ">=3.12"
dependencies = [
    "agent-contracts",
    "alembic>=1.19.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lxml>=5.0",
    "matplotlib>=3.9",
    "pypdf>=5.0,<7",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
agent-contracts = { path = "../../packages/agent-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]
