[project]
name = "agent-contracts"
version = "0.1.0"
description = "Versioned wire contracts shared by ShenZhi Backend and Agent Platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_contracts"]
