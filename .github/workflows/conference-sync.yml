name: Conference DDL sync trigger

on:
  schedule:
    # Avoid the busiest top-of-hour period; the backend owns due checks/backoff.
    - cron: '17 * * * *'
  workflow_dispatch:

# HTTP trigger only: no checkout, source download, snapshot write or pull request.
permissions: {}
concurrency:
  group: conference-ddl-sync-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: vars.CONFERENCE_SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Invoke the backend conference sync
        env:
          CONFERENCE_SYNC_URL: ${{ secrets.CONFERENCE_SYNC_URL }}
          CONFERENCE_CRON_SECRET: ${{ secrets.CONFERENCE_CRON_SECRET }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def fail(message):
              print('::error::' + message)
              raise SystemExit(1)

          url = os.environ.get('CONFERENCE_SYNC_URL', '').strip()
          secret = os.environ.get('CONFERENCE_CRON_SECRET', '').strip()
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != 'https' or not parsed.hostname
                  or parsed.username or parsed.password or parsed.query or parsed.fragment
                  or parsed.path != '/api/v1/internal/conference-sync'):
              fail('Configure the HTTPS backend conference-sync URL in repository secrets.')
          if len(secret) < 16 or not secret.isascii() or any(c.isspace() for c in secret):
              fail('Configure a random CRON_SECRET of at least 16 ASCII characters on both sides.')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + secret,
              'User-Agent': 'ShenZhi-conference-sync-trigger',
              'Cache-Control': 'no-cache',
          })
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=260) as response:
                  if response.status != 200:
                      fail('Backend returned a non-success status.')
                  raw = response.read(65537)
              if len(raw) > 65536:
                  fail('Backend response exceeded the response budget.')
              body = json.loads(raw)
              status = body.get('data', {}).get('status')
              if body.get('code') != 0 or status not in {
                  'updated', 'unchanged', 'locked', 'not-due', 'retry-delayed'
              }:
                  fail('Backend did not acknowledge a valid sync result.')
          except urllib.error.HTTPError as error:
              fail('Backend returned HTTP ' + str(error.code) + '; next scheduled request will retry.')
          except (OSError, ValueError, TypeError, AttributeError):
              fail('Backend request failed; next scheduled request will retry.')
          print('Conference sync status: ' + status)
