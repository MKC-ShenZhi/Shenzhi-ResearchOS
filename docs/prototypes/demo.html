<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>深知 ShenZhi · Research OS — Demo(复现 frontend_v1)</title>
<script>
/* 首屏前定主题:?theme= > localStorage > 系统偏好(与 frontend_v1 一致) */
(function(){try{var p=new URLSearchParams(location.search).get("theme");var t=p==="dark"||p==="light"?p:localStorage.getItem("shenzhi-theme");var d=t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d)}catch(e){}})();
</script>
<style>
/* ===== 设计令牌 —— 与 frontend_v1/app/globals.css 完全一致 ===== */
:root{
  --background:#f7f8fc; --sidebar:#eef1f8; --card:#ffffff;
  --primary:#002fa7; --primary-soft:#e9eefb;
  --violet:#5b21b6; --cyan:#155e75; --gold:#f3d029;
  --ink:#0f1419; --ink2:#374151; --muted:#6b7280; --faint:#9ca3af;
  --chip:#f3f4f6; --panel:#f9fafb; --line:#e5e7eb;
  --danger:#ef4444; --danger-soft:#fee2e2; --success:#10b981; --success-soft:#d1fae5;
  --shadow-card:0 2px 6px 0 rgb(31 41 55 / .05); --shadow-pop:0 8px 24px 0 rgb(31 41 55 / .08);
}
html.dark{
  --background:#0b1020; --sidebar:#101731; --card:#161d36;
  --primary:#5b84f1; --primary-soft:#1e2a52;
  --violet:#9f7aea; --cyan:#4fbdd9; --gold:#f3d029;
  --ink:#e9edf7; --ink2:#b7c1d9; --muted:#8791ab; --faint:#5f6b88;
  --chip:#1d2542; --panel:#111a33; --line:#26304f;
  --danger:#f87171; --danger-soft:#3d2129; --success:#34d399; --success-soft:#12332b;
  --shadow-card:0 2px 6px 0 rgb(0 0 0 / .3); --shadow-pop:0 8px 24px 0 rgb(0 0 0 / .4);
}
*{box-sizing:border-box; margin:0; padding:0; border-color:var(--line)}
html{-webkit-font-smoothing:antialiased}
body{
  background:var(--background); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; transition:background-color .2s ease,color .2s ease;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit; color:var(--ink)}
::selection{background:rgb(0 47 167 / .18)}
html.dark ::selection{background:rgb(91 132 241 / .35)}

/* ===== 侧边栏 ===== */
#sidebar{
  position:fixed; inset:0 auto 0 0; width:240px; z-index:30;
  display:flex; flex-direction:column; background:var(--sidebar); padding:20px 16px;
}
body.immersive #sidebar{display:none}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.brand{display:flex; align-items:center; gap:10px}
.brand img{width:36px; height:36px; border-radius:10px}
.brand .logo-night{display:none}
html.dark .brand .logo-day{display:none}
html.dark .brand .logo-night{display:block}
.brand-name{font-size:17px; font-weight:700; color:var(--ink); line-height:1.2}
.brand-sub{font-size:10px; color:var(--faint)}
.theme-btn{width:32px; height:32px; border-radius:8px; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px}
.theme-btn:hover{background:var(--chip); color:var(--ink)}
.search-entry{
  margin-top:20px; height:40px; width:100%; display:flex; align-items:center; gap:10px;
  border:1px solid var(--line); border-radius:12px; background:var(--card);
  padding:0 12px; font-size:13px; color:var(--faint); text-align:left;
}
.search-entry:hover{border-color:var(--primary)}
.search-entry kbd{margin-left:auto; border:1px solid var(--line); border-radius:4px; padding:2px 6px; font-size:10px}
.nav{flex:1; margin-top:16px; overflow-y:auto}
.nav-group{font-size:11px; color:var(--faint); padding:8px 12px 6px; letter-spacing:.5px}
.nav-item{
  display:flex; align-items:center; gap:12px; height:40px; padding:0 12px;
  border-radius:12px; font-size:15px; font-weight:500; color:var(--ink2); margin-bottom:2px;
}
.nav-item:hover{background:var(--card)}
.nav-item.active{background:var(--primary); color:#fff; box-shadow:0 1px 2px rgb(0 0 0/.1)}
.nav-item.disabled{opacity:.45; cursor:not-allowed}
.nav-item .ico{width:18px; text-align:center; font-size:15px}
.badge-new{background:var(--gold); color:var(--ink); border-radius:999px; padding:2px 6px; font-size:10px; font-weight:600; margin-left:auto; line-height:1}
.user-card{
  margin-top:16px; display:flex; align-items:center; gap:10px;
  background:var(--card); border-radius:12px; padding:10px; box-shadow:var(--shadow-card);
}
.user-ava{width:36px; height:36px; border-radius:999px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:15px}
.user-name{font-size:13px; font-weight:600; color:var(--ink)}
.user-title{font-size:11px; color:var(--muted)}

/* ===== 主区 ===== */
#main{margin-left:240px; min-height:100vh}
body.immersive #main{margin-left:0}
.page{max-width:1180px; margin:0 auto; padding:24px 32px}
.card{background:var(--card); border-radius:16px; box-shadow:var(--shadow-card)}
.btn{
  display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 16px;
  border-radius:10px; background:var(--primary); color:#fff; font-size:14px; font-weight:500;
}
.btn:hover{opacity:.9}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink2)}
.btn-outline:hover{border-color:var(--primary); color:var(--primary); opacity:1}
.btn-dark{background:var(--ink); color:var(--background)}
.chip{display:inline-block; background:var(--chip); color:var(--ink2); border-radius:999px; padding:3px 10px; font-size:12px}
.badge{display:inline-flex; align-items:center; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:500}
.badge-violet{background:var(--primary-soft); color:var(--primary)}
.badge-amber{background:#FEF3C7; color:#B45309}
.badge-green{background:var(--success-soft); color:#059669}
html.dark .badge-amber{background:#3a2f10; color:#f0c94e}
html.dark .badge-green{color:var(--success)}
.badge-gold{background:var(--gold); color:var(--ink); font-weight:700}
.section-title{font-size:13px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--chip); padding-bottom:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .primary{color:var(--primary)}

/* ===== 发现页 ===== */
.search-hero{padding:20px 24px}
.search-hero .row{display:flex; gap:12px}
.search-hero input{
  flex:1; height:44px; border:none; outline:none; background:transparent; font-size:15px; color:var(--ink);
}
.search-modes{display:flex; gap:8px; margin-top:14px; align-items:center}
.search-modes .mode{border-radius:999px; padding:5px 14px; font-size:13px; color:var(--muted)}
.search-modes .mode.active{background:var(--primary-soft); color:var(--primary); font-weight:500}
.feed-tabs{display:flex; gap:20px; align-items:center; margin:20px 4px 14px}
.feed-tab{font-size:14px; color:var(--muted); padding-bottom:4px}
.feed-tab.active{color:var(--primary); font-weight:600; border-bottom:2px solid var(--primary)}
.paper-card{display:flex; gap:20px; padding:20px 24px; margin-bottom:14px}
.paper-card .meta{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--faint)}
.paper-card h3{font-size:16px; font-weight:700; color:var(--ink); margin-top:6px; line-height:1.4}
.paper-card .abs{font-size:13.5px; color:var(--ink2); line-height:1.7; margin-top:8px}
.paper-card .ai-link{font-size:13px; color:var(--primary); font-weight:500; margin-top:8px; display:inline-block}
.paper-card .foot{display:flex; align-items:center; gap:16px; margin-top:12px; font-size:13px; color:var(--muted)}
.icon-btn{display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:13px}
.icon-btn:hover{color:var(--primary)}
.icon-btn.liked{color:var(--danger)}
.thumb{width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:8px}
.thumb .cite{font-size:11px; color:var(--faint); text-align:right}
.thumb .box{flex:1; min-height:110px; background:var(--panel); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:12px}

/* ===== 投稿页 ===== */
.submit-tabs{display:flex; gap:6px; align-items:center; margin-bottom:18px}
.submit-tab{padding:7px 18px; border-radius:999px; font-size:13.5px; color:var(--muted)}
.submit-tab.active{background:var(--primary); color:#fff; font-weight:500}
.result-count{margin-left:auto; font-size:13px; color:var(--faint)}
.submit-body{display:flex; gap:20px; align-items:flex-start}
.filter-panel{width:300px; flex-shrink:0; padding:20px}
.filter-panel h2{font-size:15px; font-weight:600; display:flex; gap:8px; align-items:center}
.level-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px}
.level-chip{height:36px; border:1px solid var(--line); border-radius:999px; background:var(--panel); font-size:13px; color:var(--ink2)}
.level-chip:hover{border-color:var(--primary)}
.level-chip.active{border-color:var(--primary); background:var(--primary-soft); color:var(--primary); font-weight:500}
.dir-row{display:flex; align-items:flex-start; gap:12px; padding:9px 0; font-size:13px; color:var(--ink2); cursor:pointer}
.dir-row .box{width:16px; height:16px; border:1px solid var(--line); border-radius:4px; background:var(--card); margin-top:2px; flex-shrink:0}
.dir-row:hover .box{border-color:var(--primary)}
.dir-row .cnt{margin-left:auto; font-size:12px; color:var(--faint)}
.venue-list{flex:1; display:flex; flex-direction:column; gap:14px; min-width:0}
.venue-card{padding:20px 24px; border-left:3px solid var(--success)}
.venue-card.danger{border-left-color:var(--danger)}
.venue-head{display:flex; align-items:flex-start; gap:14px}
.venue-abbr{font-size:19px; font-weight:800; color:var(--ink)}
.venue-full{font-size:12.5px; color:var(--muted); margin-top:2px}
.venue-badges{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:50%}
.venue-meta{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--muted)}
.venue-chips{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.venue-deadline{display:flex; align-items:flex-end; gap:20px; margin-top:14px}
.deadline-label{font-size:12px; color:var(--primary); background:var(--primary-soft); border-radius:6px; padding:3px 8px}
.deadline-date{font-size:12px; color:var(--faint); margin-top:4px}
.countdown{margin-left:auto; text-align:right}
.countdown .nums{font-size:24px; font-weight:700; color:var(--danger); font-variant-numeric:tabular-nums; letter-spacing:1px}
.countdown .units{font-size:10px; color:var(--faint); display:flex; gap:18px; justify-content:flex-end}
.venue-status{font-size:11px; border-radius:999px; padding:3px 10px; font-weight:600}
.status-danger{background:var(--danger-soft); color:var(--danger)}
.status-success{background:var(--success-soft); color:var(--success)}

/* ===== 论文详情(沉浸式) ===== */
.topbar{height:56px; display:flex; align-items:center; gap:14px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line)}
.topbar .back{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.topbar .back:hover{color:var(--primary)}
.topbar .title{flex:1; text-align:center; font-size:14px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.reader-body{display:flex; height:calc(100vh - 56px)}
.toc{width:190px; flex-shrink:0; padding:20px 14px; border-right:1px solid var(--line); background:var(--card); overflow-y:auto}
.toc-item{display:block; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--muted); margin-bottom:2px}
.toc-item.active{color:var(--primary); background:var(--primary-soft); font-weight:500}
.thumbs{width:120px; flex-shrink:0; padding:16px 12px; border-right:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column; gap:10px}
.thumb-page{height:74px; background:var(--card); border:1px solid var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--faint)}
.thumb-page.current{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary)}
.reader-main{flex:1; overflow-y:auto; padding:32px}
.article{max-width:720px; margin:0 auto; background:var(--card); border-radius:16px; box-shadow:var(--shadow-card); padding:40px}
.article h1{font-size:22px; font-weight:700; text-align:center; line-height:1.4}
.article .authors{margin-top:14px; text-align:center; font-size:14px; color:var(--muted); line-height:1.6}
.article .affil{margin-top:6px; text-align:center; font-size:12px; color:var(--faint)}
.article hr{width:64px; margin:24px auto 0; border:none; border-top:1px solid var(--line)}
.article h2{font-size:17px; font-weight:700; margin-top:28px}
.article p.body{margin-top:12px; font-size:15px; line-height:1.9; color:var(--ink2); text-align:justify}
.figure-ph{margin-top:24px}
.figure-ph .cap{text-align:center; font-size:12px; color:var(--faint); padding:8px 0}
.figure-ph .box{height:280px; border-radius:12px; background:var(--panel)}
.right-panel{width:320px; flex-shrink:0; border-left:1px solid var(--line); background:var(--card); display:flex; flex-direction:column}
.rp-tabs{display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.rp-tab{padding:6px 12px; border-radius:8px; font-size:13px; color:var(--muted); border:1px solid transparent}
.rp-tab.active{color:var(--primary); border-color:var(--primary)}
.rp-body{flex:1; overflow-y:auto; padding:16px}
.rp-card{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px}
.rp-card .head{display:flex; gap:10px; align-items:center}
.rp-ico{width:32px; height:32px; border-radius:8px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0}
.similar-item{display:block; background:var(--panel); border-radius:10px; padding:12px; margin-top:8px}
.similar-item:hover{background:var(--primary-soft)}
.author-chip{display:inline-block; background:var(--chip); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--ink2); margin:4px 4px 0 0}
a.author-chip:hover{background:var(--primary-soft); color:var(--primary)}
.graph-entry{display:flex; gap:12px; align-items:center; background:var(--panel); border-radius:10px; padding:12px; margin-top:10px}
.graph-entry:hover{background:var(--primary-soft)}

/* ===== 图谱页 ===== */
.graph-wrap{display:flex; height:calc(100vh - 56px)}
.graph-left{width:288px; flex-shrink:0; border-right:1px solid var(--line); background:var(--card); overflow-y:auto; padding:16px}
.origin-card{border-left:2px solid var(--primary); background:var(--panel); border-radius:12px; padding:12px; width:100%; text-align:left}
.origin-card.sel{background:var(--primary-soft)}
.origin-tag{font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--primary); text-transform:uppercase}
.rel-item{display:block; width:100%; text-align:left; border-radius:10px; padding:10px 12px; margin-top:4px}
.rel-item:hover{background:var(--panel)}
.rel-item.sel{background:var(--primary-soft)}
.rel-item.sel .rel-title{color:var(--primary)}
.graph-center{flex:1; overflow-y:auto; padding:24px; min-width:0}
.graph-right{width:320px; flex-shrink:0; border-left:1px solid var(--line); background:var(--card); overflow-y:auto; padding:20px}
.view-switch{display:flex; border:1px solid var(--line); border-radius:10px; font-size:13px}
.view-switch span{padding:6px 14px}
.view-switch .on{background:var(--primary-soft); color:var(--primary); font-weight:500; border-radius:9px 0 0 9px}
.view-switch .off{color:var(--faint)}
.svg-node{cursor:pointer}
.svg-node circle{transition:opacity .15s}
.svg-label{fill:var(--ink2); font-weight:600}
.svg-year{fill:var(--faint)}
.svg-edge{stroke:var(--line)}
.svg-edge.active{stroke:var(--primary)}
.svg-band{fill:var(--faint); letter-spacing:2px}
.graph-legend{display:flex; justify-content:center; gap:20px; margin-top:8px; font-size:12px; color:var(--faint)}
.legend-dot{width:10px; height:10px; border-radius:999px; display:inline-block; margin-right:6px; vertical-align:-1px}
.abstract-card h2{font-size:15px; font-weight:700; line-height:1.45}
.abstract-card .abs{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; line-height:1.7; color:var(--ink2)}
.detail-link{display:inline-flex; align-items:center; gap:4px; margin-top:12px; font-size:13px; font-weight:500; color:var(--primary)}
.detail-link:hover{text-decoration:underline}

/* ===== 学者页 ===== */
.scholars-body{display:flex; gap:28px; align-items:flex-start}
.dir-filter{width:190px; flex-shrink:0}
.dir-item{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; font-size:14px; color:var(--ink2); cursor:pointer; width:100%; text-align:left}
.dir-item:hover{background:var(--card)}
.dir-item .dot{width:8px; height:8px; border-radius:999px}
.dir-item .cnt{margin-left:auto; font-size:12px; color:var(--faint)}
.scholar-toolbar{display:flex; gap:12px; margin-bottom:16px}
.scholar-toolbar input{flex:1; height:40px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:0 14px; font-size:14px; outline:none}
.scholar-toolbar input:focus{border-color:var(--primary)}
.scholar-toolbar select{height:40px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:0 12px; font-size:13px; color:var(--ink2)}
.scholar-grid{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0}
.scholar-card{padding:18px 20px; display:flex; flex-direction:column; gap:10px}
.scholar-head{display:flex; gap:12px; align-items:center}
.avatar{width:44px; height:44px; border-radius:12px; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0}
.scholar-name{font-size:15px; font-weight:700; color:var(--ink)}
.scholar-en{font-size:12px; color:var(--faint)}
.scholar-aff{font-size:12px; color:var(--muted)}
.scholar-bio{font-size:12.5px; color:var(--ink2); line-height:1.6}
.scholar-foot{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--muted); margin-top:auto}
.follow-btn{margin-left:auto; height:30px; padding:0 14px; border-radius:999px; border:1px solid var(--primary); color:var(--primary); font-size:12.5px; font-weight:500}
.follow-btn.on{background:var(--primary); color:#fff}

/* ===== 学者详情 ===== */
.scholar-hero{padding:24px 28px}
.metric-row{display:flex; gap:36px; margin-top:16px}
.metric .num{font-size:22px; font-weight:800; color:var(--ink)}
.metric .lbl{font-size:12px; color:var(--faint)}
.chart-card{padding:20px; margin-top:16px}
.bars{display:flex; align-items:flex-end; gap:6px; height:96px; margin-top:14px}
.bars .bar{flex:1; border-radius:3px 3px 0 0; background:#B91C1C}
html.dark .bars .bar{background:#f87171}
.pub-card{padding:18px 20px; margin-top:12px}
.pub-card h4{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.45}
.pub-card .abs{font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:6px}

/* ===== 知识库 ===== */
.knowledge-body{display:flex; min-height:100vh}
.lib-panel{width:240px; flex-shrink:0; border-right:1px solid var(--line); background:var(--card); padding:20px}
.lib-panel h2{font-size:15px; font-weight:700}
.lib-new{width:100%; height:40px; margin-top:16px; border-radius:12px; background:var(--primary-soft); color:var(--primary); font-size:14px; font-weight:500}
.lib-new:hover{opacity:.8}
.lib-label{margin-top:20px; padding:0 4px; font-size:12px; color:var(--faint)}
.folder-item{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; font-size:14px; color:var(--ink2); cursor:pointer; width:100%; text-align:left}
.folder-item:hover{background:var(--chip)}
.folder-item.active{background:var(--primary-soft); color:var(--primary); font-weight:500}
.folder-item .sq{width:14px; height:14px; border-radius:4px; background:var(--ink2); opacity:.7; flex-shrink:0}
.folder-item.active .sq{background:var(--primary); opacity:1}
.folder-item .cnt{margin-left:auto; font-size:12px; color:var(--faint)}
.folder-item.active .cnt{background:var(--primary); color:#fff; border-radius:999px; padding:1px 7px}
.tag-chip{display:inline-block; border-radius:6px; padding:4px 8px; font-size:12px; margin:4px 4px 0 0}
.lib-table{flex:1; padding:32px; min-width:0}
.lib-row{display:grid; grid-template-columns:minmax(0,1fr) 220px 90px; gap:16px; align-items:center; padding:12px 20px; border-radius:12px; cursor:pointer}

/* =====================================================================
 * 图谱布局 —— 与 frontend_v1/lib/graph-layout.ts 完全一致的移植
 * ===================================================================== */
const VIEW_W = 1080, VIEW_H = 820, CX = VIEW_W/2, CY = VIEW_H/2 - 40;
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h/0xffffffff; }
const nodeR = w => 16 + w*30;
function concentricLayout(g){
  const placed = { [g.origin.id]:{ x:CX, y:CY, r:46 } };
  const rings = [ {min:.66,radius:145,members:[]}, {min:.4,radius:235,members:[]}, {min:0,radius:320,members:[]} ];
  for(const n of g.nodes) (rings.find(r=>n.w>r.min)||rings[2]).members.push(n);
  rings.forEach((ring,ri)=>{
    const start = -Math.PI/2 + ri*0.53;
    ring.members.forEach((n,i)=>{
      const angle = (i/ring.members.length)*Math.PI*2 + start + (hash(n.id)-.5)*.42;
      const radius = ring.radius + (hash(n.id+":r")-.5)*36;
      placed[n.id] = { x:Math.round(CX+radius*Math.cos(angle)), y:Math.round(CY+radius*Math.sin(angle)), r:nodeR(n.w) };
    });
  });
  return placed;
}
function strataLayout(g){
  const placed = {};
  const bands = [ {layer:"mine",y:190}, {layer:"folder",y:570} ];
  for(const band of bands){
    const members = [g.origin,...g.nodes].filter(n=>n.layer===band.layer).sort((a,b)=>b.w-a.w);
    const spread = Math.min(160, 880/Math.max(members.length-1,1));
    members.forEach((n,i)=>{
      placed[n.id] = { x:Math.round(CX+(i-(members.length-1)/2)*spread), y:Math.round(band.y+(hash(n.id+":y")-.5)*64), r:nodeR(n.w) };
    });
  }
  return placed;
}

function graphPageView(g, mode, opt){
  const layout = mode==="concentric" ? concentricLayout(g) : strataLayout(g);
  const all = [g.origin, ...g.nodes];
  const byId = Object.fromEntries(all.map(n=>[n.id,n]));
  let selected = g.origin.id;

  $main.innerHTML = `
  <div class="topbar">
    <a class="back" href="${opt.backHref}">← ${opt.backLabel}</a>
    <span class="title">${opt.title}</span>
    ${opt.switcher?`<div class="view-switch"><span class="on">Prior works</span><span class="off">Derivative works</span></div>`:`<span style="width:80px"></span>`}
  </div>
  <div class="graph-wrap">
    <aside class="graph-left">
      <button class="origin-card sel" data-id="${g.origin.id}">
        <p class="origin-tag">Origin paper</p>
        <p style="font-size:13px;font-weight:600;line-height:1.45;margin-top:4px">${g.origin.title}</p>
        <p class="faint" style="font-size:12px;margin-top:4px">${g.origin.authors} · ${g.origin.year}</p>
      </button>
      <div style="margin-top:14px">
        ${g.related.map(id=>{const n=byId[id];return `
        <button class="rel-item" data-id="${id}">
          <p class="rel-title" style="font-size:13px;font-weight:500;line-height:1.45;color:var(--ink2)">${n.title}</p>
          <p class="faint" style="font-size:11px;margin-top:2px">${n.authors} · ${n.year}</p>
        </button>`}).join("")}
      </div>
    </aside>
    <div class="graph-center">
      <svg viewBox="0 0 ${VIEW_W} ${VIEW_H}" style="width:100%;height:auto;user-select:none" id="graphSvg">
        ${g.edges.map(([s,t,st,cross])=>{
          const a=layout[s], b=layout[t];
          return `<line class="svg-edge" data-s="${s}" data-t="${t}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
            stroke-width="${(1+st*1.5).toFixed(2)}" ${cross?'stroke-dasharray="5 4"':""} opacity="0.9" />`;
        }).join("")}
        ${mode==="strata"?`
          <line x1="24" y1="${VIEW_H/2-40}" x2="${VIEW_W-24}" y2="${VIEW_H/2-40}" stroke="var(--line)" stroke-dasharray="3 6" />
          <text class="svg-band" x="24" y="96" font-size="13">我的发表 · ${all.filter(n=>n.layer==="mine").length}</text>
          <text class="svg-band" x="24" y="476" font-size="13">收藏论文 · ${all.filter(n=>n.layer==="folder").length}</text>`:""}
        ${all.map(n=>{
          const p=layout[n.id];
          const fill = mode==="strata" && n.layer==="folder" ? "var(--cyan)" : "var(--primary)";
          return `<g class="svg-node" data-id="${n.id}">
            <circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${fill}" fill-opacity="${(0.55+n.w*0.45).toFixed(2)}"
              stroke="var(--card)" stroke-width="2" />
            <text class="svg-label" x="${p.x}" y="${p.y+p.r+17}" text-anchor="middle" font-size="12">${n.ll[0]}</text>
            <text class="svg-year" x="${p.x}" y="${p.y+p.r+33}" text-anchor="middle" font-size="11">${n.ll[1]}</text>
          </g>`;
        }).join("")}
      </svg>
      <div class="graph-legend">
        ${mode==="strata"
          ?`<span><span class="legend-dot" style="background:var(--primary)"></span>我的发表</span>
            <span><span class="legend-dot" style="background:var(--cyan)"></span>收藏论文</span><span>虚线 = 跨层关联</span>`
          :`<span>圆圈大小 = 与原文关系强度</span>`}
      </div>
    </div>
    <aside class="graph-right"><div class="abstract-card" id="absCard"></div></aside>
  </div>`;

  const absCard = document.getElementById("absCard");
  const renderAbs = ()=>{
    const n = byId[selected];
    absCard.innerHTML = `
      <h2>${n.title}</h2>
      <p class="muted" style="font-size:12px;margin-top:8px">${n.authors}</p>
      <p class="faint" style="font-size:12px;margin-top:6px">${n.venue} · ${n.year}　❝ ${n.cite}</p>
      <p class="abs">${n.abs}</p>
      ${n.paperId?`<a class="detail-link" href="#/papers/${n.paperId}">查看论文详情 →</a>`:""}`;
  };
  const applySel = ()=>{
    document.querySelectorAll(".svg-node").forEach(el=>{
      const c = el.querySelector("circle");
      const on = el.dataset.id===selected;
      c.setAttribute("stroke", on?"var(--violet)":"var(--card)");
      c.setAttribute("stroke-width", on?"3":"2");
      if(on) c.setAttribute("fill-opacity","1");
      else c.setAttribute("fill-opacity",(0.55+byId[el.dataset.id].w*0.45).toFixed(2));
    });
    document.querySelectorAll(".origin-card,.rel-item").forEach(el=>el.classList.toggle("sel", el.dataset.id===selected));
    document.querySelectorAll(".svg-edge").forEach(el=>{
      el.classList.toggle("active", el.dataset.s===selected || el.dataset.t===selected);
    });
    renderAbs();
  };
  document.querySelectorAll(".svg-node,.origin-card,.rel-item").forEach(el=>{
    el.addEventListener("click", e=>{ e.stopPropagation(); selected = el.dataset.id; applySel(); });
  });
  document.getElementById("graphSvg").addEventListener("click", ()=>{ selected = g.origin.id; applySel(); });
  applySel();
}

/* ---------- 学者 ---------- */
function scholarsView(){
  $main.innerHTML = `
  <div class="page" style="max-width:1180px">
    <div class="scholars-body">
      <aside class="dir-filter">
        <p class="faint" style="font-size:13px;padding:0 8px">研究方向</p>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:4px">
          ${SCHOLAR_DIRS.map(d=>`<button class="dir-item"><span class="dot" style="background:${d.color}"></span>${d.name}<span class="cnt">${d.count}</span></button>`).join("")}
        </div>
      </aside>
      <div style="flex:1;min-width:0">
        <div class="scholar-toolbar">
          <input id="scholarQ" placeholder="搜索学者姓名 / 方向…" />
          <select id="scholarSort"><option value="cite">按引用排序</option><option value="h">按 H 指数排序</option></select>
        </div>
        <div class="scholar-grid" id="scholarGrid"></div>
      </div>
    </div>
  </div>`;
  const grid = document.getElementById("scholarGrid");
  const parseCite = c => c.endsWith("M") ? parseFloat(c)*1e6 : parseFloat(c)*1e3;
  const followed = new Set(SCHOLARS.filter(s=>s.followed).map(s=>s.id));
  const render = ()=>{
    const q = document.getElementById("scholarQ").value.trim().toLowerCase();
    const sort = document.getElementById("scholarSort").value;
    const list = SCHOLARS
      .filter(s=>!q || (s.cn+s.en+s.tags.join("")).toLowerCase().includes(q))
      .sort((a,b)=> sort==="h" ? b.h-a.h : parseCite(b.citations)-parseCite(a.citations));
    grid.innerHTML = list.map(s=>`
      <article class="card scholar-card">
        <div class="scholar-head">
          <span class="avatar" style="background:${s.color}">${s.ini}</span>
          <div style="flex:1;min-width:0">
            <a class="scholar-name" href="#/scholars/kaiming-he">${s.cn}</a>
            <span class="scholar-en"> ${s.en}</span>
            <div class="scholar-aff">${s.role} · ${s.aff}</div>
          </div>
        </div>
        <p class="scholar-bio">${s.bio}</p>
        <div>${s.tags.map(t=>`<span class="chip" style="margin:0 6px 4px 0">${t}</span>`).join("")}</div>
        <div class="scholar-foot">
          <span>引用 ${s.citations}</span><span>h 指数 ${s.h}</span>
          <button class="follow-btn ${followed.has(s.id)?"on":""}" data-id="${s.id}">${followed.has(s.id)?"已关注":"+ 关注"}</button>
        </div>
      </article>`).join("") || `<p class="faint" style="grid-column:1/-1;text-align:center;padding:40px">未找到匹配学者</p>`;
    grid.querySelectorAll(".follow-btn").forEach(b=>b.onclick=()=>{
      const id=b.dataset.id;
      if(followed.has(id)){ followed.delete(id); b.classList.remove("on"); b.textContent="+ 关注"; }
      else { followed.add(id); b.classList.add("on"); b.textContent="已关注"; }
    });
  };
  document.getElementById("scholarQ").oninput = render;
  document.getElementById("scholarSort").onchange = render;
  render();
}

/* =====================================================================
 * 路由
 * ===================================================================== */
let countdownTimer = null;
function route(){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  const h = location.hash.slice(1) || "/";
  document.body.classList.toggle("immersive", h.startsWith("/papers"));
  if(h==="/") homeView();
  else if(h==="/submit") submitView();
  else if(h==="/papers/rdt-1b") paperView();
  else if(h==="/papers/rdt-1b/graph") graphPageView(PUBLIC_GRAPH,"concentric",{ backHref:"#/papers/rdt-1b", backLabel:"返回阅读器", title:PUBLIC_GRAPH.origin.title, switcher:true });
  else if(h==="/scholars") scholarsView();
  else if(h==="/scholars/kaiming-he") scholarDetailView();
  else if(h==="/knowledge") knowledgeView();
  else if(h==="/knowledge/graph") graphPageView(PRIVATE_GRAPH,"strata",{ backHref:"#/knowledge", backLabel:"返回知识库", title:"私域知识图谱", switcher:false });
  else if(h==="/agents") agentsView();
  else homeView();
  document.querySelectorAll(".nav-item[data-route]").forEach(a=>{
    const r = a.dataset.route;
    const on = r==="/" ? h==="/" : h.startsWith(r);
    a.classList.toggle("active", on);
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
